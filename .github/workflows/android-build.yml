name: RS TV Android Build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "catalog/generated/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/draft-release.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["RS TV Channel Candidate Catalogue"]
    types: [completed]
    branches: [main]

concurrency:
  group: rs-tv-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Test and build SINJAR TV APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK and install packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify required release-signing secrets
        if: github.event_name != 'pull_request'
        env:
          RS_TV_KEYSTORE_BASE64: ${{ secrets.RS_TV_KEYSTORE_BASE64 }}
          RS_TV_KEYSTORE_PASSWORD: ${{ secrets.RS_TV_KEYSTORE_PASSWORD }}
          RS_TV_KEY_ALIAS: ${{ secrets.RS_TV_KEY_ALIAS }}
          RS_TV_KEY_PASSWORD: ${{ secrets.RS_TV_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in RS_TV_KEYSTORE_BASE64 RS_TV_KEYSTORE_PASSWORD RS_TV_KEY_ALIAS RS_TV_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Decode SINJAR TV release keystore
        if: github.event_name != 'pull_request'
        env:
          RS_TV_KEYSTORE_BASE64: ${{ secrets.RS_TV_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RS_TV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rs-tv-release.jks"
          test -s "$RUNNER_TEMP/rs-tv-release.jks"
          echo "RS_TV_KEYSTORE_FILE=$RUNNER_TEMP/rs-tv-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          RS_TV_KEYSTORE_PASSWORD: ${{ secrets.RS_TV_KEYSTORE_PASSWORD }}
          RS_TV_KEY_ALIAS: ${{ secrets.RS_TV_KEY_ALIAS }}
          RS_TV_KEY_PASSWORD: ${{ secrets.RS_TV_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed release APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "===== SHA-256 ====="
          sha256sum "$APK"

      - name: Create draft GitHub Release and upload APKs
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sinjar-tv-build-${{ github.run_number }}
          name: SINJAR TV Build ${{ github.run_number }}
          body: |
            Automated SINJAR TV build.

            Built from commit: ${{ github.sha }}

            Attached:
            - app-release.apk: signed release build
            - app-debug.apk: debug/testing build

            This release is a draft. Review it and publish manually when ready.
          draft: true
          prerelease: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
