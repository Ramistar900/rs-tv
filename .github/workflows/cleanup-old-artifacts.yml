name: Clean old SINJAR TV Artifacts

on:
  workflow_dispatch:
    inputs:
      keep_latest:
        description: Number of newest Debug and Release APK artifacts to keep
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: write

concurrency:
  group: rs-tv-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete old SINJAR TV test APK artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Remove older test APK artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const keepLatest = Number(context.payload.inputs?.keep_latest || "2");
            if (![1, 2, 3, 5].includes(keepLatest)) {
              core.setFailed("Invalid keep_latest value.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const allowedNames = new Set([
              "SINJAR-TV-APK",
              "SINJAR-TV-Release-APK"
            ]);

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            let deleted = 0;
            let kept = 0;
            for (const name of allowedNames) {
              const matching = artifacts
                .filter(a => a.name === name && !a.expired)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              for (const artifact of matching.slice(0, keepLatest)) {
                kept++;
              }

              for (const artifact of matching.slice(keepLatest)) {
                core.info(`Deleting ${artifact.name} #${artifact.id} created ${artifact.created_at} (${artifact.size_in_bytes} bytes)`);
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                });
                deleted++;
              }
            }

            core.summary
              .addHeading("SINJAR TV artifact cleanup")
              .addTable([
                [{data: "Result", header: true}, {data: "Count", header: true}],
                ["Artifacts kept (newest per APK type)", String(kept)],
                ["Old artifacts deleted", String(deleted)]
              ])
              .addQuote("Only SINJAR-TV-APK and SINJAR-TV-Release-APK were considered. GitHub Releases and source code were not changed.")
              .write();
            core.info(`Cleanup complete. Kept: ${kept}; deleted: ${deleted}.`);
