name: RS TV Draft Release

on:
  workflow_run:
    workflows: ["RS TV Android Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rs-tv-draft-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish-draft:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    name: Build and attach signed APK to draft release
    runs-on: ubuntu-latest
    steps:
      - name: Verify signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.RS_TV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RS_TV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RS_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RS_TV_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing RS_TV_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing RS_TV_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing RS_TV_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing RS_TV_KEY_PASSWORD secret"; exit 1; }

      - name: Checkout the exact successful commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK and install packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type d -print || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore private release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RS_TV_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/rs-tv-signing"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rs-tv-signing/rs-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/rs-tv-signing/rs-tv-release.jks"
          echo "RS_TV_KEYSTORE_FILE=$RUNNER_TEMP/rs-tv-signing/rs-tv-release.jks" >> "$GITHUB_ENV"

      - name: Rebuild, test and sign release APK
        env:
          RS_TV_KEYSTORE_PASSWORD: ${{ secrets.RS_TV_KEYSTORE_PASSWORD }}
          RS_TV_KEY_ALIAS: ${{ secrets.RS_TV_KEY_ALIAS }}
          RS_TV_KEY_PASSWORD: ${{ secrets.RS_TV_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          TAG="rs-tv-build-$SOURCE_RUN_ID"
          TITLE="RS TV build $SOURCE_RUN_ID"
          NOTES="Signed release APK built from commit $SOURCE_SHA.\n\nSource Android Build run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID\n\nThis release is intentionally kept as a draft for review."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#rs-tv.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK#rs-tv.apk" --draft --title "$TITLE" --notes "$NOTES" --target "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY"
          fi
