name: RS TV Playlist Source Quality Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * *"
  push:
    branches: [main]
    paths:
      - "tools/check_playlist_quality.py"
      - "tools/test_check_playlist_quality.py"
      - "tools/probe_channel_streams.py"
      - "tools/test_probe_channel_streams.py"
      - "tools/scan_channel_health.py"
      - "tools/test_scan_channel_health.py"
      - "app/src/main/java/com/sinjartv/rstv/RemotePlaylistSources.kt"
      - "app/src/test/java/com/sinjartv/rstv/RemotePlaylistSourcesTest.kt"
      - "catalog/sources.json"
      - "catalog/README.md"
      - ".github/workflows/playlist-quality-audit.yml"

permissions:
  contents: read

concurrency:
  group: rs-tv-playlist-quality-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run audit unit tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Audit public playlist sources
        if: github.event_name != 'pull_request'
        run: python tools/check_playlist_quality.py --output quality-report.json

      - name: Probe a small sample of channel endpoints
        if: github.event_name != 'pull_request'
        run: python tools/probe_channel_streams.py --output stream-probe-report.json

      - name: Rotate and test a global batch of unique stream URLs
        if: github.event_name != 'pull_request'
        run: python tools/scan_channel_health.py --limit 600 --workers 24 --state catalog/generated/stream-health.json --output channel-health-report.json

      - name: Publish global channel health summary
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          import os

          with open("channel-health-report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          lines = [
              "",
              "# Global stream health batch",
              "",
              f"- Unique HTTPS streams discovered across sources: **{report['total_unique_https_streams_discovered']:,}**",
              f"- Checked in this run: **{report['streams_checked_this_batch']:,}**",
              f"- Batch: **{report['batch_index'] + 1}/{report['batch_count']}**",
              f"- HLS first segments with bytes received: **{report['hls_first_segments_checked']:,}**",
              f"- Direct media responses with bytes received: **{report['direct_media_bytes_checked']:,}**",
              f"- Current persistent catalogue states: **{report['catalogue_status_totals']}**",
              f"- Transient retries in this batch: **{report['retry_slots_used']}**",
              "",
              "| Result | Count |",
              "|---|---:|",
          ]
          for status, count in sorted(report["status_totals"].items()):
              lines.append(f"| {status} | {count:,} |")
          lines.extend([
              "",
              "> A first-segment or byte response is a stronger endpoint check, not a full device playback test. It does not grant or establish broadcast rights.",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Publish audit summary
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          import os

          with open("quality-report.json", encoding="utf-8") as handle:
              quality = json.load(handle)
          with open("stream-probe-report.json", encoding="utf-8") as handle:
              probes = json.load(handle)

          lines = [
              "# RS TV IPTV source audit",
              "",
              f"- Sources available: **{quality['sources_available']}/{quality['sources_checked']}**",
              f"- Raw playlist entries: **{quality.get('total_playlist_entries', 0):,}**",
              f"- Unique eligible HTTPS stream URLs across sources: **{quality.get('unique_eligible_stream_urls_across_sources', 0):,}**",
              f"- Duplicate stream URLs across sources: **{quality.get('duplicate_stream_urls_across_sources', 0):,}**",
              f"- Endpoint samples: **{probes['samples_attempted']}**",
              f"- HLS first-segment checks: **{probes['status_totals'].get('playback_segment_checked', 0)}**",
              "",
              "> HTTP response is not a full playback test and does not establish broadcast rights.",
              "",
              "| Source | Entries | Unique eligible HTTPS |",
              "|---|---:|---:|",
          ]
          for source in quality["sources"]:
              if source["status"] == "ok":
                  lines.append(f"| {source['source_id']} | {source['entries']:,} | {source['eligible_unique_https_urls']:,} |")
              else:
                  lines.append(f"| {source['source_id']} | ERROR | — |")
          lines.extend(["", "## Endpoint sample results", "", "| Source | Channel | Result |", "|---|---|---|"])
          for source in probes["sources"]:
              for sample in source["samples"]:
                  lines.append(f"| {source['source_id']} | {sample.get('channel', '—')} | {sample['status']} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY


      - name: Upload stream health state for the persistence job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rs-tv-stream-health-state
          path: catalog/generated/stream-health.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload quality reports
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: rs-tv-playlist-quality-report
          path: |
            quality-report.json
            stream-probe-report.json
            channel-health-report.json
            catalog/generated/stream-health.json
          retention-days: 14

  persist-health-state:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    needs: audit
    name: Persist generated health state with write permission
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download generated stream health state
        uses: actions/download-artifact@v4
        with:
          name: rs-tv-stream-health-state
          path: state-artifact

      - name: Commit updated health state
        shell: bash
        run: |
          set -euo pipefail
          STATE_FILE="$(find state-artifact -type f -name 'stream-health.json' -print -quit)"
          if [ -z "$STATE_FILE" ]; then
            echo "::error::Generated stream-health.json artifact was not found"
            exit 1
          fi
          mkdir -p catalog/generated
          cp "$STATE_FILE" catalog/generated/stream-health.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/generated/stream-health.json
          if git diff --cached --quiet; then
            echo "No stream health state changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh IPTV stream health state"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying against the latest main"
          done
          echo "::error::Unable to persist health state after three attempts"
          exit 1
